<div class="menu-container">
  <!-- Main Dropdown -->
  <button (click)="toggleDropdown()" (mouseenter)="toggleDropdown()">Menu</button>
  
  <ul *ngIf="isDropdownOpen" class="dropdown">
    <li class="back-button" *ngIf="menuStack.length > 0" (click)="goBack()">⬅ Back</li>

    <li *ngFor="let item of currentMenu; let i = index"
        [class.active]="i === activeIndex"
        (click)="openSubmenu(item, i)"
        tabindex="0">
      {{ item.label }}
    </li>
  </ul>
</div>
